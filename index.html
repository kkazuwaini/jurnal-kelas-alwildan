<!DOCTYPE html>
<html lang="id">
<head>

    <!-- Tailwind CSS -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        islamic: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',

                        gold: {

                    fontFamily: {

    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
            .card-box { border: 1px solid #ccc !important; box-shadow: none !important; }
            .page-break { page-break-before: always; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center space-x-4">

                            <circle cx="50" cy="50" r="32" fill="#FF5500"/>

                            <path id="textPathBottom" d="M 88 50 A 38 38 0 0 1 12 50" fill="none"/>
                            <text fill="#00FF00" font-size="9" font-weight="bold" font-family="sans-serif">
                                <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">AL-WILDAN 20</textPath>
                            </text>
                            <text fill="#00FF00" font-size="7.5" font-weight="bold" font-family="sans-serif">
                                <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">ISLAMIC SCHOOL MATARAM</textPath>
                            </text>
                            <g transform="translate(50, 50)">
                                <rect x="-18" y="-18" width="36" height="36" fill="#00FF00" />

                            </g>
                            <g transform="translate(50, 50) scale(0.9)">
                                <path d="M -14 -6 C -8 -9 -2 -9 0 -5 C 2 -9 8 -9 14 -6 L 14 7 C 8 4 2 4 0 7 C -2 4 -8 4 -14 7 Z" fill="#FFFFFF"/>

                    </div>
                    <div>
                        <div class="text-xs text-gold-400 font-semibold uppercase tracking-wider">SD AL-WILDAN ISLAMIC SCHOOL 20 MATARAM</div>
                        <div class="flex items-center gap-2">
                            <h1 class="text-2xl font-bold tracking-tight" id="display-class-name">Jurnal Kelas 2 Inter 1</h1>
                            <button onclick="openEditClassNameModal()" class="text-xs bg-white/10 hover:bg-white/20 text-gold-400 px-2 py-1 rounded border border-white/20 transition" title="Edit Nama Kelas">
                                <i class="fa-solid fa-pen"></i> Edit Kelas
                            </button>
                        </div>
                        <p class="text-xs text-islamic-100 mt-0.5 flex items-center gap-2">
                            <span><i class="fa-regular fa-calendar-alt"></i> <span id="current-date"></span></span>
                            <span>•</span>
                            <span>Tahun Ajaran 2025/2026</span>
                        </p>
                    </div>
                </div>

                <!-- Action Top Button -->
                <div class="flex items-center gap-2 flex-wrap">
                    <button onclick="window.print()" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 border border-white/20">
                        <i class="fa-solid fa-print"></i> Cetak Rekap Umum
                    </button>
                    <button onclick="openPrintStudentModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3 py-2 rounded-lg text-sm transition flex items-center gap-2 shadow border border-emerald-500">
                        <i class="fa-solid fa-file-pdf"></i> Cetak Raport/Rekap Siswa
                    </button>
                    <button onclick="openManageStudentsModal()" class="bg-gold-500 hover:bg-gold-600 text-slate-900 font-semibold px-3 py-2 rounded-lg text-sm transition flex items-center gap-2 shadow">
                        <i class="fa-solid fa-user-gear"></i> Kelola Siswa & Foto
                    </button>
                </div>
            </div>

            <!-- RINGKASAN STATISTIK QUICK VIEW -->
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 mt-6">
                <div class="bg-white/10 backdrop-blur rounded-xl p-3 border border-white/10">
                    <div class="text-xs text-islamic-100">Total Siswa</div>
                    <div class="text-2xl font-bold text-white mt-1" id="stat-total-siswa">0</div>
                </div>
                <div class="bg-emerald-500/25 backdrop-blur rounded-xl p-3 border border-emerald-400/30">
                    <div class="text-xs text-emerald-200">Hadir (H)</div>
                    <div class="text-2xl font-bold text-emerald-300 mt-1" id="stat-hadir">0</div>
                </div>
                <div class="bg-blue-500/25 backdrop-blur rounded-xl p-3 border border-blue-400/30">
                    <div class="text-xs text-blue-200">Izin (I)</div>
                    <div class="text-2xl font-bold text-blue-300 mt-1" id="stat-izin">0</div>
                </div>
                <div class="bg-amber-500/25 backdrop-blur rounded-xl p-3 border border-amber-400/30">
                    <div class="text-xs text-amber-200">Sakit (S)</div>
                    <div class="text-2xl font-bold text-amber-300 mt-1" id="stat-sakit">0</div>
                </div>
                <div class="bg-rose-500/25 backdrop-blur rounded-xl p-3 border border-rose-400/30">
                    <div class="text-xs text-rose-200">Alpa / Terlambat</div>
                    <div class="text-2xl font-bold text-rose-300 mt-1" id="stat-alpa-terlambat">0</div>
                </div>
                <div class="bg-purple-500/25 backdrop-blur rounded-xl p-3 border border-purple-400/30">
                    <div class="text-xs text-purple-200">Total Catatan Kasus</div>
                    <div class="text-2xl font-bold text-purple-300 mt-1" id="stat-total-kasus">0</div>
                </div>
            </div>
        </div>
    </header>

    <!-- PRINT HEADER ONLY -->
    <div class="print-only p-6 border-b border-gray-300 mb-4">
        <div class="flex items-center justify-center gap-4 text-center">
            <div class="w-16 h-16 shrink-0">
                <svg viewBox="0 0 100 100" class="w-full h-full">
                    <circle cx="50" cy="50" r="48" fill="#0000FF" stroke="#FF5500" stroke-width="2"/>
                    <circle cx="50" cy="50" r="32" fill="#FF5500"/>
                    <path id="printTextPathTop" d="M 12 50 A 38 38 0 0 1 88 50" fill="none"/>
                    <path id="printTextPathBottom" d="M 88 50 A 38 38 0 0 1 12 50" fill="none"/>
                    <text fill="#00FF00" font-size="9" font-weight="bold" font-family="sans-serif">
                        <textPath href="#printTextPathTop" startOffset="50%" text-anchor="middle">AL-WILDAN 20</textPath>
                    </text>
                    <text fill="#00FF00" font-size="7.5" font-weight="bold" font-family="sans-serif">
                        <textPath href="#printTextPathBottom" startOffset="50%" text-anchor="middle">ISLAMIC SCHOOL MATARAM</textPath>
                    </text>
                    <g transform="translate(50, 50)">
                        <rect x="-18" y="-18" width="36" height="36" fill="#00FF00" />
                        <rect x="-18" y="-18" width="36" height="36" fill="#00FF00" transform="rotate(45)" />
                    </g>
                    <g transform="translate(50, 50) scale(0.9)">
                        <path d="M -14 -6 C -8 -9 -2 -9 0 -5 C 2 -9 8 -9 14 -6 L 14 7 C 8 4 2 4 0 7 C -2 4 -8 4 -14 7 Z" fill="#FFFFFF"/>
                        <line x1="0" y1="-5" x2="0" y2="7" stroke="#00FF00" stroke-width="1.5"/>
                    </g>
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold uppercase">SD AL-WILDAN ISLAMIC SCHOOL 20 MATARAM</h1>
                <h2 class="text-lg font-semibold text-gray-700" id="print-class-title">REKAPITULASI JURNAL KELAS 2 INTER 1</h2>
                <p class="text-sm text-gray-500">Tanggal Rekap: <span id="print-date"></span></p>
            </div>
        </div>
    </div>

    <!-- KHUSUS CONTAINER CETAK REKAP PER SISWA (MUNCUL SAAT PRINT) -->
    <div id="print-student-container" class="print-only"></div>

    <!-- MAIN CONTENT CONTAINERS -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full no-print">
        
        <!-- NAV TABS -->
        <div class="flex border-b border-slate-200 mb-6 overflow-x-auto">
            <button id="tab-btn-kehadiran" onclick="switchTab('kehadiran')" class="py-3 px-5 font-semibold text-sm border-b-2 border-islamic-600 text-islamic-700 flex items-center gap-2 whitespace-nowrap transition">
                <i class="fa-solid fa-clipboard-user"></i> 1. Daftar Kehadiran Siswa
            </button>
            <button id="tab-btn-kasus" onclick="switchTab('kasus')" class="py-3 px-5 font-medium text-sm text-slate-500 hover:text-slate-700 border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap transition">
                <i class="fa-solid fa-book-bookmark"></i> 2. Jurnal Kasus & Perilaku
            </button>
        </div>

        <!-- TAB 1: DAFTAR KEHADIRAN -->
        <section id="tab-kehadiran" class="space-y-4">

            <div class="bg-white p-4
